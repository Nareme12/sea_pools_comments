<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piscinas Naturales y de Marea del Mundo</title>
    
    <!-- CSS Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f4f7f6;
        }

        header {
            background-color: #0277bd;
            color: white;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        #container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #sidebar {
            width: 320px;
            background: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            z-index: 500;
        }

        .filter-section {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .filter-section label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #333;
        }

        .filter-section select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #pool-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .pool-item {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .pool-item:hover {
            background-color: #e1f5fe;
        }

        .pool-item h3 {
            font-size: 1rem;
            color: #0277bd;
            margin-bottom: 4px;
        }

        .pool-item p {
            font-size: 0.85rem;
            color: #666;
        }

        #map {
            flex: 1;
            height: 100%;
        }

        @media (max-width: 768px) {
            #container {
                flex-direction: column-reverse;
            }
            #sidebar {
                width: 100%;
                height: 40%;
            }
            #map {
                height: 60%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🏊‍♂️ Explorador de Piscinas Naturales y de Marea</h1>
    </header>

    <div id="container">
        <div id="sidebar">
            <div class="filter-section">
                <label for="country-filter">Filtrar por País:</label>
                <select id="country-filter">
                    <option value="ALL">Todos los países</option>
                </select>
            </div>
            <ul id="pool-list"></ul>
        </div>
        <div id="map"></div>
    </div>

    <!-- JS Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Inicializar mapa
        const map = L.map('map').setView([20, 0], 2);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let geojsonLayer;
        let allFeatures = [];

        // Cargar el archivo GeoJSON externo
        fetch('piscinas.geojson')
            .then(response => {
                if (!response.ok) {
                    throw new Error("No se pudo cargar el archivo GeoJSON");
                }
                return response.json();
            })
            .then(data => {
                allFeatures = data.features;
                populateCountryFilter(allFeatures);
                renderGeoJSON("ALL");
            })
            .catch(error => console.error('Error cargando el GeoJSON:', error));

        // Rellenar dinámicamente el selector de países
        function populateCountryFilter(features) {
            const select = document.getElementById('country-filter');
            const countries = new Set();

            features.forEach(f => {
                const country = f.properties.CNTR_CODE || f.properties.country || f.properties.PAIS;
                if (country) countries.add(country);
            });

            Array.from(countries).sort().forEach(code => {
                const opt = document.createElement('option');
                opt.value = code;
                opt.textContent = code;
                select.appendChild(opt);
            });
        }

        // Renderizar capas y lista según el filtro
        function renderGeoJSON(selectedCountry) {
            if (geojsonLayer) {
                map.removeLayer(geojsonLayer);
            }

            const listContainer = document.getElementById('pool-list');
            listContainer.innerHTML = '';

            const filteredData = {
                type: "FeatureCollection",
                features: selectedCountry === "ALL" 
                    ? allFeatures 
                    : allFeatures.filter(f => (f.properties.CNTR_CODE || f.properties.country || f.properties.PAIS) === selectedCountry)
            };

            geojsonLayer = L.geoJSON(filteredData, {
                onEachFeature: function (feature, layer) {
                    const p = feature.properties;
                    const name = p.NAME || p.name || p.NOMBRE || "Piscina Natural";
                    const size = p.SIZE || p.size || "N/A";
                    const tide = p.TIDE || p.tide || "N/A";
                    const coast = p.COASTSP || p.coast || "N/A";

                    // Popup en el mapa
                    layer.bindPopup(`
                        <strong style="color:#0277bd; font-size:1.1em;">${name}</strong><br>
                        <b>Superficie:</b> ${size}<br>
                        <b>Marea:</b> ${tide}<br>
                        <b>Sustrato:</b> ${coast}
                    `);

                    // Item en la lista lateral
                    const li = document.createElement('li');
                    li.className = 'pool-item';
                    li.innerHTML = `<h3>${name}</h3><p>Superficie: ${size}</p>`;
                    li.onclick = () => {
                        if (layer.getBounds) {
                            map.fitBounds(layer.getBounds());
                        } else if (layer.getLatLng) {
                            map.setView(layer.getLatLng(), 14);
                        }
                        layer.openPopup();
                    };
                    listContainer.appendChild(li);
                }
            }).addTo(map);

            if (filteredData.features.length > 0 && selectedCountry !== "ALL") {
                map.fitBounds(geojsonLayer.getBounds().pad(0.2));
            } else if (selectedCountry === "ALL" && allFeatures.length > 0) {
                map.setView([20, 0], 2);
            }
        }

        // Listener para el filtro
        document.getElementById('country-filter').addEventListener('change', (e) => {
            renderGeoJSON(e.target.value);
        });
    </script>
</body>
</html>
