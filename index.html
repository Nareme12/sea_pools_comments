<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piscinas Naturales y de Marea</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #121212;
            color: #ffffff;
        }

        header {
            background-color: #1f2937;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        header h1 {
            font-size: 1.4rem;
            color: #38bdf8;
        }

        #container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #sidebar {
            width: 340px;
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            z-index: 500;
        }

        .filter-section {
            padding: 15px;
            border-bottom: 1px solid #334155;
        }

        .filter-section label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #94a3b8;
        }

        .filter-section select {
            width: 100%;
            padding: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            border-radius: 4px;
        }

        #pool-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .pool-item {
            padding: 12px 15px;
            border-bottom: 1px solid #334155;
            cursor: pointer;
            transition: background 0.2s;
        }

        .pool-item:hover {
            background-color: #334155;
        }

        .pool-item h3 {
            font-size: 0.95rem;
            color: #38bdf8;
            margin-bottom: 4px;
        }

        .pool-item p {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        #map {
            flex: 1;
            height: 100%;
        }

        /* Estilos Popup y Valoraciones */
        .leaflet-popup-content-wrapper {
            background: #1e293b;
            color: #f8fafc;
            border-radius: 8px;
        }

        .leaflet-popup-tip {
            background: #1e293b;
        }

        .popup-title {
            color: #38bdf8;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .popup-info {
            font-size: 0.85rem;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .reviews-section {
            border-top: 1px solid #334155;
            padding-top: 8px;
            margin-top: 8px;
        }

        .reviews-title {
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #f1f5f9;
        }

        .review-list {
            max-height: 100px;
            overflow-y: auto;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }

        .review-item {
            background: #0f172a;
            padding: 5px 8px;
            border-radius: 4px;
            margin-bottom: 4px;
        }

        .star-rating {
            color: #f59e0b;
        }

        .review-form label {
            font-size: 0.75rem;
            display: block;
            margin-top: 4px;
        }

        .review-form select, .review-form textarea, .review-form button {
            width: 100%;
            margin-top: 4px;
            background: #0f172a;
            color: white;
            border: 1px solid #475569;
            border-radius: 4px;
            padding: 4px;
            font-size: 0.8rem;
        }

        .review-form button {
            background: #0284c7;
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding: 6px;
            margin-top: 6px;
        }

        .review-form button:hover {
            background: #0369a1;
        }

        @media (max-width: 768px) {
            #container { flex-direction: column-reverse; }
            #sidebar { width: 100%; height: 40%; }
            #map { height: 60%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🌊 Piscinas de Marea (Vista Satélite)</h1>
    </header>

    <div id="container">
        <div id="sidebar">
            <div class="filter-section">
                <label for="country-filter">Filtrar por País:</label>
                <select id="country-filter">
                    <option value="ALL">Todos los países</option>
                </select>
            </div>
            <ul id="pool-list"></ul>
        </div>
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Inicializar mapa
        const map = L.map('map').setView([20, 0], 2);

        // 2. Basemap Satelital (Esri World Imagery)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        }).addTo(map);

        let geojsonLayer;
        let allFeatures = [];

        // 3. Obtener comentarios guardados en el navegador
        function getSavedReviews(poolId) {
            const data = localStorage.getItem('pool_reviews_' + poolId);
            return data ? JSON.parse(data) : [];
        }

        function saveReview(poolId, rating, comment) {
            const reviews = getSavedReviews(poolId);
            reviews.push({ rating: parseInt(rating), comment: comment, date: new Date().toLocaleDateString() });
            localStorage.setItem('pool_reviews_' + poolId, JSON.stringify(reviews));
        }

        // 4. Cargar GeoJSON
        fetch('piscinas.geojson')
            .then(response => {
                if (!response.ok) throw new Error("No se pudo cargar el archivo piscinas.geojson");
                return response.json();
            })
            .then(data => {
                allFeatures = data.features;
                populateCountryFilter(allFeatures);
                renderGeoJSON("ALL");
            })
            .catch(error => console.error('Error cargando el GeoJSON:', error));

        function populateCountryFilter(features) {
            const select = document.getElementById('country-filter');
            const countries = new Set();

            features.forEach(f => {
                const country = f.properties.CNTR_CODE || f.properties.country || f.properties.PAIS;
                if (country) countries.add(country);
            });

            Array.from(countries).sort().forEach(code => {
                const opt = document.createElement('option');
                opt.value = code;
                opt.textContent = code;
                select.appendChild(opt);
            });
        }

        function buildPopupContent(feature) {
            const p = feature.properties;
            // Solo dejamos el nombre que viene en la propiedad
            const name = p.NAME || p.name || p.NOMBRE || "Sin Nombre";
            const poolId = encodeURIComponent(name);
            const size = p.SIZE || p.size || "N/A";
            const tide = p.TIDE || p.tide || "N/A";

            const reviews = getSavedReviews(poolId);
            let reviewsHtml = '';
            
            if (reviews.length === 0) {
                reviewsHtml = '<p style="color:#94a3b8;">Sin valoraciones aún.</p>';
            } else {
                reviewsHtml = reviews.map(r => `
                    <div class="review-item">
                        <span class="star-rating">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                        <p>${r.comment}</p>
                    </div>
                `).join('');
            }

            return `
                <div class="popup-title">${name}</div>
                <div class="popup-info">
                    <b>Superficie:</b> ${size}<br>
                    <b>Marea:</b> ${tide}
                </div>
                <div class="reviews-section">
                    <div class="reviews-title">Valoraciones y Comentarios:</div>
                    <div class="review-list" id="reviews-${poolId}">
                        ${reviewsHtml}
